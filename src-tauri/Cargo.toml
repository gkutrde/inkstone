[package]
name = "inkstone"
version = "0.1.0"
description = "A focused Markdown writing studio"
authors = ["Inkstone"]
license = "MIT"
repository = "https://github.com/gkutrde/inkstone"
edition = "2021"

[lib]
name = "inkstone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
trash = "5"
tempfile = "3"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
